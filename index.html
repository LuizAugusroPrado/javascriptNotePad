g.plotMyPolarFunction = function(ObjFormule)
{
  try
  {
    ObjFormule.acumulada = 0;
    if( ObjFormule.parameters!=null && !Array.isArray( ObjFormule.parameters))
     ObjFormule.parameters.acumulada=0;

    var Dx = Math.PI/180;
    this.escala = Math.pow(2, this.potenciaAtual+4); 
    
    this.TmW = this.offsetWidth /this.escala;
    this.TmH = this.offsetHeight/this.escala;
    var Ox = this.Observador.x;
    var Oy = this.Observador.y;
    var myPontos = [];

    MyErros.innerHTML ="";
    var n = 0;
    for(var o=0; o<ObjFormule.parameters.lenght; o++)
    {
       if(ObjFormule.parameters[o]!=0) 
       {
          n=o;
          break;
       }
    }
    for (var theta = -Math.PI; theta <= Math.PI; theta += Dx) 
    {
       // 1. O valor da função na coordenada polar é o RAIO (r)
       var raio = ObjFormule.getValue(theta);
       // 2. Conversão Polar -> Cartesiana:
       var px = raio * Math.cos(theta);
       var py = raio * Math.sin(theta);
       // 3. Aplica o deslocamento de origem (Ox, Oy), centraliza no canvas e aplica a escala
       var canvasX = ( px - Ox +(this.TmW / 2))* this.escala;
       var canvasY = (-py - Oy +(this.TmH / 2))* this.escala;
       myPontos.push([canvasX, canvasY]);
    }
    this.drawLine(myPontos, ObjFormule.lineWidth, ObjFormule.color);
  }
  catch(erro){  MyErros.innerHTML = erro.stack;}
};

g.plotMyFunctions = function()
{
    this.Clean();
    for(var i=0; i<this.myFunctions.length; i++)
    {
        if( this.myFunctions[i].isToPlot)
        {
          if( this.myFunctions[i].isPolar!==undefined && this.myFunctions[i].isPolar==true)
          {
             this.plotMyPolarFunction(this.myFunctions[i]);
          }
          else
          {
             this.myFunctions[i].acumulada = 0;
             this.plotMyFunction(this.myFunctions[i]);
          }
        }
    }
    this.ctx.beginPath();
    this.ctx.fillStyle = "blue"; 
    this.ctx.font = "15px Arial"; 
    this.ctx.fillText("x: "+this.Observador.x+" y: "+this.Observador.y, 10,20);
    this.ctx.fill();
    this.plotAxis();
    this.plotSqrCheby();
};

var Grau1 =function(x, p) { return p[0]*x + p[1]; } ;
var Grau2 =function(x, p) { return p[0]*x*x + p[1]*x + p[2]; } ;
var Grau3 =function(x, p) { return p[0]*x*x*x + 
    p[1]*x*x + p[2]*x + p[3];} ;

var Grau4 =function(x, p) { return p[0]*x*x*x*x +
    p[1]*x*x*x + p[2]*x*x + p[3]*x + p[4] ; };

var Grau5 =function(x, p) { return p[0]*x*x*x*x*x +
    p[1]*x*x*x*x + p[2]*x*x*x + p[3]*x*x + p[4]*x + p[5] ; };

var Exp = function(x)
{
    return Math.pow(Math.E, x);
}
var Pow = function(x, b)
{
    var last = ""+x
    if( x<0 )
    {
       if(!Number(last.charAt(last.length-1) ) %2)
          return   Math.pow(-x, b);
       else
          return - Math.pow(-x, b);
    }
    if(x==0) return 0;
    else return Math.pow(x,b);
}
var Log = function(x, b)
{
    var xs = Math.abs(x);
    var bs = Math.abs(b);

    if( b==null) return (Math.log(xs)*xs/x);
    else         return (Math.log(xs)*xs/x)/(Math.log(bs)*bs/b)
}
var oneOver = function(x)
{
    if (x==0) return null;
    else return (1/x);
}
var Chebyshev = function(angle, obj)
{
    return obj.getValueK(Math.cos(angle));
}

var Bernoulli = function(angle, obj)
{
    var r = obj.getValueK(Math.cos(angle));
    return Math.pow(r,0.5);
}

function formatarCodigoAllmanFinal(codigoFonte) {
    let resultado = "";
    let i = 0;
    let nivelIndentacao = 0;
    const espacosPorNivel = "    "; // CORRIGIDO: Adicionados os 4 espaços que sumiram

    function obterIndentacao() {
        return espacosPorNivel.repeat(nivelIndentacao);
    }

    while (i < codigoFonte.length) {
        let char = codigoFonte[i];

        // 1. IGNORAR COMENTÁRIOS DE UMA LINHA (// ...)
        if (char === '/' && codigoFonte[i + 1] === '/') {
            resultado += "//";
            i += 2;
            while (i < codigoFonte.length && codigoFonte[i] !== '\n') {
                resultado += codigoFonte[i];
                i++;
            }
            continue;
        }

        // 2. IGNORAR COMENTÁRIOS DE MÚLTIPLAS LINHAS (/* ... */)
        if (char === '/' && codigoFonte[i + 1] === '*') { // CORRIGIDO: Era '', mudado para '*'
            resultado += "/*";
            i += 2;
            while (i < codigoFonte.length) {
                if (codigoFonte[i] === '*' && codigoFonte[i + 1] === '/') { // CORRIGIDO: Era '', mudado para '*'
                    resultado += "*/";
                    i += 2;
                    break;
                }
                resultado += codigoFonte[i];
                i++;
            }
            continue;
        }

        // 3. IGNORAR STRINGS
        if (char === '"' || char === "'" || char === '`') {
            let tipoAspas = char;
            resultado += char;
            i++;
            while (i < codigoFonte.length) {
                resultado += codigoFonte[i];
                // CORRIGIDO: Escapada a barra invertida '\\' para o JS não anular a aspa
                if (codigoFonte[i] === tipoAspas && codigoFonte[i - 1] !== '\\') {
                    break;
                }
                i++;
            }
            i++;
            continue;
        }

        // 4. IGNORAR EXPRESSÕES REGULARES (Regex)
        if (char === '/') {
            let anterior = resultado.trim().slice(-1);
            if (!/[a-zA-Z0-9)]/.test(anterior)) {
                resultado += char;
                i++;
                while (i < codigoFonte.length) {
                    resultado += codigoFonte[i];
                    // CORRIGIDO: Escapada a barra invertida '\\'
                    if (codigoFonte[i] === '/' && codigoFonte[i - 1] !== '\\') {
                        break;
                    }
                    i++;
                }
                i++;
                continue;
            }
        }

        // 5. CHAVE DE ABERTURA {
        if (char === '{') {
            resultado = resultado.trimEnd();
            if (!resultado.endsWith('\n')) {
                resultado += "\n";
            }
            resultado += obterIndentacao() + "{\n";
            nivelIndentacao++;
            resultado += obterIndentacao();
            i++;
            continue;
        }

        // 6. CHAVE DE FECHAMENTO }
        if (char === '}') {
            nivelIndentacao = Math.max(0, nivelIndentacao - 1);
            resultado = resultado.trimEnd();
            if (!resultado.endsWith('\n')) {
                resultado += "\n";
            }
            resultado += obterIndentacao() + "}\n";
            resultado += obterIndentacao();
            i++;
            continue;
        }

        /* 7. QUEBRAS DE LINHA NO CÓDIGO */
        if (char === '\n') {
            resultado = resultado.trimEnd() + "\n" + obterIndentacao();
            i++;
            continue;
        }

        resultado += char;
        i++;
    }

    /* Limpeza estética das linhas */
    return resultado
        .split('\n')
        .map(linha => linha.trim() === "" ? "" : linha)
        .join('\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}

var InitGraphic = function()
{

 canvas.TmW = canvas.width = 550; 
 canvas.TmH = canvas.height = 550;

 canvas.ctx = canvas.getContext("2d"); 
 canvas.showGrid = true;
 canvas.Clean = function()
 {
     this.ctx.fillStyle = "#FFFFFF"; 
     this.ctx.fillRect(0,0,this.offsetWidth,this.offsetHeight);
 }
 canvas.drawLine = function(pontos, lineWidth, color )
 {
    this.ctx.lineWidth = lineWidth; 
    this.ctx.strokeStyle = color; 
    this.ctx.beginPath();
    for(var y=0; y<pontos.length; y++)
    {
         if(pontos[y]!=null)
         {
            if(y==0 || pontos[y-1]==null)
            {
               //this.ctx.beginPath();
               this.ctx.moveTo(pontos[y][0],pontos[y][1]); 
            }
            else
            {
               this.ctx.lineTo(pontos[y][0],pontos[y][1]);
            }
         }
         else
         {
            this.ctx.stroke();
         }
    }
    this.ctx.stroke();
 }

 canvas.plotMyFunction = function(formule, params, lineWidth, color, myX, myY)
 {
    MyDx = 1; 
    MyXi = 0; 
    if(myX==null) myX= 0; 
    if(myY==null) myY= 0;  
    var totalCount = this.width/MyDx; 
    var myPontos = []; 
    var yfOld = null; 
    for(var x1 = -this.TmW / 2; x1 < this.TmW / 2; x1 += MyDx)
    {
         var yf = 0;
         // Aplica a escala no X que entra na fórmula
         var xReal = (x1 / this.escala) + myX;
         
         if(params==null) 
            yf = (formule(xReal)+myY)*this.escala; 
         else 
            yf = (formule(xReal, params)+myY)*this.escala; 
            
         if(yf==null && yfOld!=null) 
            myPontos.push(null); 
         else if( yf!=null) 
            // Mantém exatamente o seu push original intacto
            myPontos.push([x1+this.offsetWidth/2, -yf+this.offsetHeight/2]); 
         yfOld = yf;
    }
    this.drawLine(myPontos, lineWidth, color);
 };

var DerivadaPontoX = function(x, params, MyFunct)
{
 var h = 0.00000001;
 var xi = x-h; var yi = null;
 var xf = x+h; var yf = null;
 if(params!=null){ yi = MyFunct(xi, params); yf = MyFunct(xf, params);}
 else            { yi = MyFunct(xi); yf = MyFunct(xf);}
 if (yi === null || yf === null) return 0;
 return (yf-yi)/(xf-xi);
}

var Derivada = function(x, p)
{
 return DerivadaPontoX(x, p.params, p.myFuncA);
};

// Nova abordagem: Calcula a área acumulada por trapézios de um X inicial até o X atual
var CalcularAreaAcumulada = function(xLimite, params, MyFunct) 
{
    var xInicial = -10; // Defina aqui onde o seu gráfico começa na esquerda da tela (ex: -10)
    var passos = 200;   // Quantidade de fatias para o cálculo numérico
    var dx = (xLimite - xInicial) / passos;
    
    // ATENÇÃO PARA O e^x: se a função for Exp e começar antes de 0, a matemática se ajusta.
    // Mas para garantir o comportamento padrão de integrais definidas, começamos em 0.

    var areaTotal = 0; 
    var xAtual = xInicial;
    var yAnterior = (params != null) ? MyFunct(xAtual, params) : MyFunct(xAtual);
    for (var i = 1; i <= passos; i++) 
    {
        xAtual = xInicial + (i * dx);
        var yAtual = (params != null) ? MyFunct(xAtual, params) : MyFunct(xAtual);
        // Regra do Trapézio: média das alturas * largura
        areaTotal += ((yAtual + yAnterior) / 2) * dx;
        yAnterior = yAtual;
    }
    return areaTotal;
};

var Integral = function(x, p) 
{
    return CalcularAreaAcumulada(x, p.params, p.myFuncA);
}
